{{- if .Values.kubernetesMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshift-mcp-server.fullname" . }}-k8s-mcp
  namespace: {{ .Values.namespace }}
  annotations:
    app.openshift.io/runtime-image: {{ .Chart.Icon }}
  labels:
    {{- include "openshift-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-mcp
    app.openshift.io/runtime: openshift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "openshift-mcp-server.fullname" . }}-k8s-mcp
  template:
    metadata:
      annotations:
        app.openshift.io/runtime-image: {{ .Chart.Icon }}
      labels:
        app: {{ include "openshift-mcp-server.fullname" . }}-k8s-mcp
        app.kubernetes.io/component: k8s-mcp
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      volumes:
        - name: config
          configMap:
            name: {{ include "openshift-mcp-server.fullname" . }}-k8s-mcp
        - name: helm-cache
          emptyDir: {}
        - name: helm-data
          emptyDir: {}
      initContainers:
        - name: helm-repo-update
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ['sh', '-c']
          args:
            - |
              mkdir -p /helm-cache/repository
              curl -sL https://charts.openshift.io/index.yaml -o /helm-cache/repository/openshift-helm-charts-index.yaml
              echo "Downloaded openshift-helm-charts index: $(wc -c < /helm-cache/repository/openshift-helm-charts-index.yaml) bytes"
          volumeMounts:
            - name: helm-cache
              mountPath: /helm-cache
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      containers:
        - name: kubernetes-mcp-server
          image: "{{ .Values.kubernetesMcp.image.repository }}:{{ .Values.kubernetesMcp.image.tag }}"
          imagePullPolicy: {{ .Values.kubernetesMcp.image.pullPolicy }}
          command: ["/openshift-mcp-server"]
          args:
            - "--config"
            - "/etc/k8s-mcp/config.toml"
          env:
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          volumeMounts:
            - name: config
              mountPath: /etc/k8s-mcp/config.toml
              subPath: config.toml
              readOnly: true
            - name: config
              mountPath: /tmp/helm/config/repositories.yaml
              subPath: repositories.yaml
              readOnly: true
            - name: helm-cache
              mountPath: /tmp/helm/cache
            - name: helm-data
              mountPath: /tmp/helm/data
          ports:
            - containerPort: {{ .Values.kubernetesMcp.service.port }}
              protocol: TCP
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.kubernetesMcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
{{- end }}

{{- if .Values.inspector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-inspector
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-inspector
  template:
    metadata:
      labels:
        app: mcp-inspector
    spec:
      containers:
        - name: mcp-inspector
          image: {{ .Values.inspector.image }}
          ports:
            - containerPort: {{ .Values.inspector.port }}
          env:
            - name: MCP_SERVER_URL
              value: "http://{{ include "openshift-mcp-server.fullname" . }}.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.port }}/mcp"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-inspector
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.inspector.port }}
      targetPort: {{ .Values.inspector.port }}
  selector:
    app: mcp-inspector
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-inspector
  namespace: {{ .Values.namespace }}
spec:
  to:
    kind: Service
    name: mcp-inspector
  port:
    targetPort: {{ .Values.inspector.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}

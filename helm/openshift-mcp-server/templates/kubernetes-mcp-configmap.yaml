{{- if .Values.kubernetesMcp.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshift-mcp-server.fullname" . }}-k8s-mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshift-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-mcp
data:
  config.toml: |
    log_level = 3
    port = {{ .Values.kubernetesMcp.service.port | quote }}
    {{- if .Values.kubernetesMcp.readOnly }}
    read_only = true
    {{- else }}
    read_only = false
    {{- end }}
    disable_destructive = false
    toolsets = [{{ range $i, $t := (splitList "," .Values.kubernetesMcp.toolsets) }}{{ if $i }}, {{ end }}{{ $t | quote }}{{ end }}]

    denied_resources = [
      {group = "rbac.authorization.k8s.io", version = "v1"}
    ]
  repositories.yaml: |
    apiVersion: ""
    generated: "0001-01-01T00:00:00Z"
    repositories:
      - caFile: ""
        certFile: ""
        insecure_skip_tls_verify: false
        keyFile: ""
        name: openshift-helm-charts
        password: ""
        url: https://charts.openshift.io/
        username: ""
      - caFile: ""
        certFile: ""
        insecure_skip_tls_verify: false
        keyFile: ""
        name: openshift-mcp
        password: ""
        url: https://maximilianoPizarro.github.io/openshift-mcp-server
        username: ""
      - caFile: ""
        certFile: ""
        insecure_skip_tls_verify: false
        keyFile: ""
        name: showroom-docs-mcp
        password: ""
        url: https://maximilianoPizarro.github.io/showroom-docs-mcp
        username: ""
{{- end }}

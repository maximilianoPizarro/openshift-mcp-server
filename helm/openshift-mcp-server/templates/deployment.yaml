apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshift-mcp-server.fullname" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    app.openshift.io/runtime-image: {{ .Chart.Icon }}
  labels:
    {{- include "openshift-mcp-server.labels" . | nindent 4 }}
    app.openshift.io/runtime: openshift
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openshift-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        app.openshift.io/runtime-image: {{ .Chart.Icon }}
      labels:
        {{- include "openshift-mcp-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: openshift-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
              name: http
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

# ============================================================================
# OpenShift MCP Server - Developer Sandbox Edition
# ============================================================================
# Optimized for Red Hat Developer Sandbox environments with:
#   - Namespace-scoped RBAC (no cluster-admin required)
#   - Qwen3 8B model via RHOAI vLLM
#   - Limited tool availability based on ServiceAccount permissions
#
# IMPORTANT: In Developer Sandbox, only tools that operate within the
# namespace are functional. Cluster-wide monitoring, node-level diagnostics,
# and KubeBurner density tests require the full version with cluster-admin.
#
# Usage:
#   helm install openshift-mcp-server openshift-mcp/openshift-mcp-server \
#     --namespace $NAMESPACE \
#     -f values-developer-sandbox.yaml
# ============================================================================

replicaCount: 1

image:
  repository: quay.io/maximilianopizarro/openshift-mcp-server
  tag: latest
  pullPolicy: Always

namespace: maximilianopizarro5-dev

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30

# ── RBAC: Namespace-scoped (no cluster-admin) ──
serviceAccount:
  create: true
  name: openshift-mcp-server
  scope: namespace
  clusterRole: ""

# ── MCP Inspector ──
inspector:
  enabled: true
  image:
    repository: mcpuse/inspector
    tag: latest
    pullPolicy: IfNotPresent
  mcpServerUrl: ""
  service:
    type: ClusterIP
    port: 8080
  route:
    enabled: true
    timeout: "300s"
    tls:
      termination: edge
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── LiteLLM with Qwen3 8B ──
litellm:
  enabled: true
  image:
    repository: litellm/litellm-non_root
    tag: v1.82.3-stable
    pullPolicy: IfNotPresent
  service:
    port: 4000
  route:
    enabled: true
    tls:
      termination: edge
  masterKey: "sk-openshift-mcp-1234"
  model:
    name: qwen3
    modelId: isvc-qwen3-8b
    apiBase: "http://isvc-qwen3-8b-predictor.qwen3-model.svc.cluster.local:8080/v1"
    apiKey: "dummy"
  postgres:
    enabled: true
    image:
      repository: registry.redhat.io/rhel9/postgresql-15
      tag: latest
    user: litellm
    password: litellm
    database: litellm
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# ── Kubernetes MCP Server (namespace-scoped, read-only recommended) ──
kubernetesMcp:
  enabled: true
  image:
    repository: quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/openshift-mcp-server
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    name: ""
  service:
    port: 8085
  route:
    enabled: true
  readOnly: false
  toolsets: "core,helm"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── OLSConfig (disabled for sandbox) ──
olsConfig:
  enabled: false

# ============================================================================
# AVAILABLE TOOLS IN DEVELOPER SANDBOX (namespace-scoped SA):
# ============================================================================
#
# FUNCTIONAL (namespace-level permissions):
#   Monitoring:
#     - detectResourceIssues      Pods with high CPU/memory or excessive restarts
#     - analyzePodDisruptions     Evictions, OOM kills, restart patterns
#     - monitorDeployments        Deployment rollout health and replica status
#
#   Deployment:
#     - createDeployment          Create deployments with custom config
#     - deployDatabase            Deploy PostgreSQL/MySQL/MongoDB/Redis
#     - createHpa                 Configure horizontal pod autoscalers
#     - createService             Create ClusterIP/NodePort/LoadBalancer services
#     - createNetworkPolicy       Create network policies
#
#   Performance Testing:
#     - runStorageBenchmark       Storage I/O benchmarks with FIO
#     - runNetworkTest            Network throughput with iperf3
#     - runCpuStressTest          CPU/memory stress testing
#     - runDatabaseBenchmark      Database benchmarks
#
#   Kubernetes MCP (namespace-scoped):
#     - resources_list/get/create/delete  Resource CRUD within namespace
#     - pods_list/get/delete/exec/log     Pod operations within namespace
#     - helm_install/list/uninstall       Helm operations within namespace
#     - events_list                        Events within namespace
#
# NOT AVAILABLE (require cluster-admin):
#     - checkClusterHealth        Needs access to all nodes and namespaces
#     - getPerformanceMetrics     Needs Metrics API (cluster-wide)
#     - checkNodeConditions       Needs node resource access
#     - checkKubeletStatus        Needs node/systemd access
#     - checkCrioStatus           Needs node/systemd access
#     - analyzeJournalctlPodErrors Needs node journal access
#     - runKubeBurner             Needs cluster-wide namespace creation
#     - nodes_top / nodes_log     Needs node resource access
# ============================================================================

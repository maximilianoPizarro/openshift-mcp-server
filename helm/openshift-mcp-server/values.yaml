replicaCount: 1

image:
  repository: quay.io/maximilianopizarro/openshift-mcp-server
  tag: latest
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

namespace: maximilianopizarro5-dev

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: openshift-mcp-server
  clusterRole: cluster-admin

inspector:
  enabled: true
  image:
    repository: mcpuse/inspector
    tag: latest
    pullPolicy: IfNotPresent
  mcpServerUrl: ""
  service:
    type: ClusterIP
    port: 8080
  route:
    enabled: true
    timeout: "300s"
    tls:
      termination: edge
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

litellm:
  enabled: true
  image:
    repository: litellm/litellm-non_root
    tag: v1.82.3-stable
    pullPolicy: IfNotPresent
  service:
    port: 4000
  route:
    enabled: true
    tls:
      termination: edge
  masterKey: "sk-openshift-mcp-1234"
  model:
    name: qwen3
    modelId: isvc-qwen3-8b
    apiBase: "http://isvc-qwen3-8b-predictor.qwen3-model.svc.cluster.local:8080/v1"
    apiKey: "dummy"
  postgres:
    enabled: true
    image:
      repository: registry.redhat.io/rhel9/postgresql-15
      tag: latest
    user: litellm
    password: litellm
    database: litellm
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

kubernetesMcp:
  enabled: true
  image:
    repository: quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/openshift-mcp-server
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    name: ""
  service:
    port: 8085
  route:
    enabled: true
  readOnly: true
  toolsets: "core,helm"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

olsConfig:
  enabled: false
  mcpServerName: openshift-mcp-server
  mcpServerTimeout: 30
  llm:
    provider: rhoai_vllm
    model: granite-3-8b-instruct
    url: ""
    credentialsSecret: ols-llm-credentials

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ site.baseurl }}/openshift-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;900&family=Red+Hat+Mono:wght@400;500;700&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="header-bar"></div>
    <div class="header-content">
      <img src="{{ site.baseurl }}/openshift-logo.png" alt="OpenShift" width="30" height="30">
      <h1>OpenShift MCP Server</h1>
      <nav class="header-nav">
        <a href="{{ site.baseurl }}/">Home</a>
        <a href="https://github.com/maximilianoPizarro/openshift-mcp-server">GitHub</a>
        <a href="https://github.com/openshift/openshift-mcp-server">Upstream</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://github.com/maximilianoPizarro/openshift-mcp-server">GitHub</a>
      <a href="https://github.com/openshift/openshift-mcp-server">Upstream Project</a>
      <a href="https://www.redhat.com/en/technologies/cloud-computing/openshift">Red Hat OpenShift</a>
    </div>
    <p>Apache License 2.0 &middot; Built for <a href="https://www.redhat.com/en/technologies/cloud-computing/openshift/lightspeed">OpenShift Lightspeed</a></p>
    <p style="margin-top:0.4rem;">Created by <a href="https://maximilianopizarro.github.io">maximilianoPizarro</a></p>
  </footer>
</body>
</html>
